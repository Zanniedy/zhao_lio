# nav 目录下所有已确认有数据的 Mid-360 包。
# 2026-05-12 的包使用 PointCloud2(timestamp)，其余旧包使用 Livox CustomMsg。
# 没有真值，只比较轨迹是否发散、延迟、CPU、内存和轨迹长度。

output: ~/datasets/liobench/nav_all

source:
  lidar:
    topic: /livox/lidar
    decoder: livox_custom
    time_base: header
  imu:
    topic: /livox/imu
    acc_unit: g

sensor:
  model: mid360
  satu_acc: 29.4
  satu_gyro: 35.0
  blind: 0.5
  extrinsic_t: [-0.011, -0.02329, 0.04412]
  extrinsic_r: [1, 0, 0, 0, 1, 0, 0, 0, 1]

sequences:
  b0522_1744:
    bag: ~/cs_project/nav/rosbag2_2025_05_22-17_44_21
  b0522_1908:
    bag: ~/cs_project/nav/rosbag2_2025_05_22-19_08_51
  b0109_1422:
    bag: ~/cs_project/nav/rosbag2_2026_01_09-14_22_57
  m0512_1852:
    bag: ~/cs_project/nav/rosbag2_2026_05_12-18_52_44
    source:
      lidar:
        topic: /livox/lidar
        decoder: pointcloud2
        time_field: timestamp
        time_unit: s
        time_ref: absolute
        ring_field: null
        intensity_field: intensity
