# zhao_lio 每个开发版本都要跑的测试（见 dev/zhao_lio.yaml）：Mid360 序列
# 控制在能经常跑的规模；有新的 Mid360 序列就会自动加进来（tiers/*）
name: dev_zhao_lio
algorithms:
  - name: zhao_lio
    params:
      update_strategy: [pointwise, pointwise_prematch]
sequences: [tiers/*]            # 所有已转换的 Mid360 序列，未转换的会跳过
repeats: 3                      # 序列短（约 66 s），重复 3 次看波动
rate: 1.0
rpe: {delta: 1, unit: m}
divergence: {max_speed: 10, max_jump: 2, min_coverage: 0.9, max_ate: 2}
