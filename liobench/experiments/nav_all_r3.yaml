# 所有 nav 包，每个算法每个包跑 3 次：zhao_lio 为主算法，其他算法横向对比。
name: nav_all_r3
algorithms:
  - zhao_lio
  - name: zhao_lio
    params: {update_strategy: [pointwise]}
  - point_lio
  - batch_lio
  - small_point_lio
  - super_lio
  - genz_lio
sequences: [nav_all/*]
repeats: 3
rate: 1.0
startup_timeout: 30
warmup: 2
drain_timeout: 15
rpe: {delta: 1, unit: m}
divergence: {max_speed: 10, max_jump: 2, min_coverage: 0.9, max_ate: 10}
